[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-osint"
version = "0.1.0"
description = "OSINT toolkit for phone number investigation (legal sources only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
dependencies = [
    "phonenumbers>=8.13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
phone-osint = "phone_osint.__main__:app"

[tool.setuptools.packages.find]
include = ["phone_osint*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
